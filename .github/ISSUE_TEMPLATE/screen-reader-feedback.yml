name: Screen reader feedback
description: What you pressed, what your screen reader said, and what you expected.
title: "[Screen reader] "
labels: ["screen reader feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. This project has been checked only by its author, a sighted developer: fully with VoiceOver in Safari on macOS, partly with NVDA in Chrome on Windows, not at all with JAWS or Firefox. Reports from people who use a screen reader every day help the most. Short answers are fine, and the last three questions are optional.
  - type: input
    id: screen-reader
    attributes:
      label: Screen reader and version
      placeholder: "NVDA 2025.3, JAWS 2026, VoiceOver on macOS 26.2"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Firefox 140, Chrome 142, Safari 26.2"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS 26.2"
    validations:
      required: true
  - type: textarea
    id: pressed
    attributes:
      label: What you pressed
      description: The keys, in order, and on which task or page (for example, the dhtmlx-gantt demo).
      placeholder: "On \"Launch\", Shift+P twice, then arrow up"
    validations:
      required: true
  - type: textarea
    id: heard
    attributes:
      label: What you heard
      description: As close to the words as you can, including what came first.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What you wanted to hear or happen instead. If the answer was right but not useful, say so.
    validations:
      required: true
  - type: textarea
    id: dependencies-clear
    attributes:
      label: "Optional: was the dependencies answer (Shift+D) clear the first time you heard it?"
      description: For example, on the task "Launch" in the demo. If not, what was hard to follow?
    validations:
      required: false
  - type: textarea
    id: row-read-again
    attributes:
      label: "Optional: does it bother you that the row is read again a few seconds after a jump?"
      description: Seen with NVDA. About 5 seconds after a jump (Shift+P, Shift+S, Shift+C, Shift+Z) or after closing the task form, the row is read again without the result. Say whether you heard it with your screen reader, and whether it gets in the way.
    validations:
      required: false
  - type: textarea
    id: key-conflicts
    attributes:
      label: "Optional: do the Shift+letter keys conflict with your habits, other programs or your keyboard layout?"
      description: Which key, and with what. Every key can be changed by the developer of the page.
    validations:
      required: false
