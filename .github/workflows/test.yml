# Unit tests (node:test) and browser tests (Playwright, Chromium and WebKit).
# The browser tests serve the folder with python3 (playwright.config.js).
name: test

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  browser:
    # WebKit is the closest to Safari on macOS, where the extension is checked with VoiceOver.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
