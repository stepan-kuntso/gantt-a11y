<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Gantt study</title>
	<link rel="stylesheet" href="../node_modules/dhtmlx-gantt/codebase/dhtmlxgantt.css">
	<script src="../node_modules/dhtmlx-gantt/codebase/dhtmlxgantt.js"></script>
	<style>
		html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; }
		header { padding: 8px 16px; }
		h1 { font-size: 18px; margin: 4px 0; }
		p { margin: 4px 0; }
		button { font: inherit; padding: 4px 12px; }
		button:focus-visible { outline: 3px solid #2453c7; outline-offset: 2px; }
		#gantt_here { width: 100%; height: 520px; }
		/* dhtmlxgantt.css declares the Inter font from fonts.gstatic.com; using the system
		   font instead means it is never downloaded, so the page makes no network request. */
		[class*="gantt_"], [class*="gantt_"] * { font-family: system-ui, sans-serif !important; }
	</style>
</head>
<body>
	<header>
		<h1>Website redesign plan</h1>
		<p>Press Tab to enter the plan, then use the arrow keys. Reloading the page restores the original plan.</p>
		<p><button type="button" id="toggle" aria-pressed="true">Screen reader helpers</button> <span id="state">on</span></p>
	</header>
	<main>
		<div id="gantt_here"></div>
	</main>

	<script type="module">
		// Study page: fixed data, the extension on or off. No data is collected,
		// stored or sent anywhere. ?a11y=off starts without the extension,
		// ?verbosity=brief|detailed sets the level.
		import { enableGanttA11y } from "../src/index.js";

		const params = new URLSearchParams(location.search);
		const verbosity = params.get("verbosity") || "standard";

		gantt.plugins({ keyboard_navigation: true });
		gantt.config.date_format = "%Y-%m-%d";
		gantt.init("gantt_here");
		gantt.parse({
			data: [
				{ id: 1, text: "Website redesign", type: "project", open: true },
				{ id: 2, text: "Software design", start_date: "2026-06-01", duration: 4, parent: 1 },
				{ id: 3, text: "Implementation", start_date: "2026-06-05", duration: 8, parent: 1 },
				{ id: 4, text: "Testing", start_date: "2026-06-13", duration: 5, parent: 1, progress: 0.4 },
				{ id: 5, text: "Documentation", start_date: "2026-06-05", duration: 10, parent: 1 },
				{ id: 6, text: "Code review", start_date: "2026-06-08", duration: 5, parent: 1 },
				{ id: 7, text: "Launch", start_date: "2026-06-18", duration: 1, parent: 1 },
				{ id: 8, text: "Marketing prep &amp; PR", start_date: "2026-06-10", duration: 9, parent: 1 },
				{ id: 9, text: "Retrospective", start_date: "2026-06-22", duration: 1, parent: 1 },
				{ id: 10, text: "Go-live", type: "milestone", start_date: "2026-06-20", parent: 1 },
				{ id: 11, text: "Budget approval", start_date: "2026-06-02", duration: 2, parent: 1, readonly: true }
			],
			links: [
				{ id: 1, source: 2, target: 3, type: "0" },
				{ id: 2, source: 3, target: 4, type: "0" },
				{ id: 3, source: 3, target: 5, type: "1" },
				{ id: 4, source: 3, target: 6, type: "2" },
				{ id: 5, source: 7, target: 8, type: "3" },
				{ id: 6, source: 4, target: 7, type: "0" },
				{ id: 7, source: 5, target: 7, type: "0" },
				{ id: 8, source: 6, target: 7, type: "0" },
				{ id: 9, source: 11, target: 7, type: "0" },
				{ id: 10, source: 2, target: 7, type: "1" }
			]
		});

		const enable = () => enableGanttA11y(gantt, { verbosity, features: { rowLabel: true } });
		let a11y = params.get("a11y") === "off" ? null : enable();

		const toggle = document.getElementById("toggle");
		const state = document.getElementById("state");
		function show() {
			toggle.setAttribute("aria-pressed", a11y ? "true" : "false");
			state.textContent = a11y ? "on" : "off";
		}
		toggle.addEventListener("click", () => {
			if (a11y) {
				a11y.disable();
				a11y = null;
			} else {
				a11y = enable();
			}
			show();
		});
		show();
	</script>
</body>
</html>
