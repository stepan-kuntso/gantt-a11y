<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>gantt-a11y test: cell navigation</title>
	<link rel="stylesheet" href="../../node_modules/dhtmlx-gantt/codebase/dhtmlxgantt.css">
	<script src="../../node_modules/dhtmlx-gantt/codebase/dhtmlxgantt.js"></script>
</head>
<body>
	<div id="chart" style="width:100%;height:400px;"></div>
	<script type="module">
		import { enableGanttA11y } from "../../src/index.js";
		gantt.plugins({ keyboard_navigation: true });
		gantt.config.keyboard_navigation_cells = true;
		gantt.config.date_format = "%Y-%m-%d";
		gantt.config.columns = [
			{ name: "text", label: "Task name", tree: true, width: 160, editor: { type: "text", map_to: "text" } },
			{ name: "duration", label: "Duration", width: 80, editor: { type: "number", map_to: "duration" } }
		];
		gantt.init("chart");
		gantt.parse({
			data: [
				{ id: 1, text: "Design", start_date: "2026-06-01", duration: 4 },
				{ id: 2, text: "Build", start_date: "2026-06-05", duration: 8 }
			],
			links: [{ id: 1, source: 1, target: 2, type: "0" }]
		});
		window.a11y = enableGanttA11y(gantt);
	</script>
</body>
</html>
